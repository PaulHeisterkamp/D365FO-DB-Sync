; Customer/project specific values - kept empty in the repository, fill it in locally.
; Lines before the first [Section] are ignored (use them for comments like these).
;
; [TransactionLessExclude]
;   Extra tables to exclude for a transaction-less copy (one exact name or wildcard pattern
;   per line), e.g. your own log/journal tables whose TableGroup is not a transaction group.
;   They are added to Tables to Exclude after the lines of the same section in
;   DefaultValues.ini when you click "Init transaction-less copy".
;   Do not put comments inside a section - every line there is used as a table pattern.
;
; [TransactionLessItemRelations]
;   Your own item master tables whose item column has a non-standard name, as TABLE|COLUMN
;   (e.g. MYALTERNATIVEITEMS|ITEM). "Init transaction-less copy" then limits them to items
;   used on SALESLINE like the standard item tables: a text column is treated as the ItemId
;   (matched with DATAAREAID when the table has one), an integer column as InventTable.RecId.
;
; This file is not part of the release package, so unpacking a new version never
; overwrites it. Keep it next to DBSyncTool.exe.

